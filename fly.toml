# fly.toml app configuration file generated for telegramforwarderbot on 2026-11-01T09:06:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'telegramforwarderbot'
primary_region = 'ams'

[build]

[processes]
  app = 'python forwarder.py'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
